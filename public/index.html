<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lead Finder</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');
:root{--bg:#0a0a0f;--s:#111118;--s2:#1a1a24;--s3:#22222f;--b:#2a2a3a;--a:#6c63ff;--g:#00d4aa;--y:#ffd166;--r:#ff6584;--t:#e8e8f0;--m:#6b6b80;--reddit:#ff4500;--bsky:#0085ff;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--t);font-family:'Inter',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;font-size:13px;}
.header{background:var(--s);border-bottom:1px solid var(--b);padding:0 16px;height:52px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
.logo{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px;color:var(--a);}
.logo span{color:var(--t);}
.dot{width:7px;height:7px;border-radius:50%;background:var(--g);box-shadow:0 0 6px var(--g);animation:p 2s infinite;}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
.hright{margin-left:auto;display:flex;align-items:center;gap:8px;}
.btn{background:var(--s2);border:1px solid var(--b);border-radius:7px;color:var(--m);cursor:pointer;font-family:'Inter',sans-serif;font-size:12px;padding:5px 12px;transition:all .15s;}
.btn:hover{border-color:var(--a);color:var(--t);}
.btnp{background:var(--a);border:1px solid var(--a);border-radius:7px;color:white;cursor:pointer;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;padding:5px 12px;}
.btnp:hover{background:#5a52e0;}
.inp{background:var(--s2);border:1px solid var(--b);border-radius:7px;color:var(--t);font-size:12px;outline:none;padding:5px 12px;}
.inp:focus{border-color:var(--a);}
.ptabs{display:flex;gap:6px;padding:0 16px;background:var(--s);border-bottom:1px solid var(--b);height:40px;align-items:center;flex-shrink:0;}
.ptab{background:none;border:1px solid transparent;border-radius:6px;color:var(--m);cursor:pointer;font-size:12px;font-weight:500;padding:4px 14px;transition:all .15s;}
.ptab.active{background:var(--s2);border-color:var(--b);color:var(--t);}
.ptab.reddit.active{border-color:var(--reddit);color:var(--reddit);background:rgba(255,69,0,.1);}
.ptab.bsky.active{border-color:var(--bsky);color:var(--bsky);background:rgba(0,133,255,.1);}
.abar{background:var(--s);border-bottom:1px solid var(--b);padding:0 16px;height:38px;display:flex;align-items:center;gap:8px;flex-shrink:0;}
.ach{background:var(--s2);border:1px solid var(--b);border-radius:20px;color:var(--m);cursor:pointer;font-size:12px;font-weight:500;padding:3px 12px;}
.ach:hover{border-color:var(--a);color:var(--t);}
.ach.active{border-color:var(--a);color:var(--t);background:rgba(108,99,255,.2);}
.body{display:flex;flex:1;overflow:hidden;}
.sidebar{width:220px;flex-shrink:0;background:var(--s);border-right:1px solid var(--b);display:flex;flex-direction:column;overflow:hidden;}
.sh{padding:12px 12px 6px;font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--m);text-transform:uppercase;}
.ss{flex:1;overflow-y:auto;padding:4px 8px;}
.cl{font-size:9px;font-weight:700;letter-spacing:1.5px;color:var(--m);text-transform:uppercase;padding:10px 6px 4px;}
.ki{display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:7px;cursor:pointer;border:1px solid transparent;}
.ki:hover{background:var(--s2);}
.ki.active{background:var(--s2);border-color:var(--a);}
.kc{width:14px;height:14px;border:1.5px solid var(--b);border-radius:3px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;}
.ki.active .kc{background:var(--a);border-color:var(--a);color:white;}
.kt{font-size:12px;flex:1;}
.kn{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--m);background:var(--s3);border-radius:8px;padding:1px 6px;}
.sf{padding:8px;border-top:1px solid var(--b);display:flex;gap:6px;}
.sf input{flex:1;background:var(--s2);border:1px solid var(--b);border-radius:6px;color:var(--t);font-size:12px;padding:5px 8px;outline:none;}
.sf input:focus{border-color:var(--a);}
.sf button{background:var(--a);border:none;border-radius:6px;color:white;cursor:pointer;font-size:16px;font-weight:700;padding:0 10px;}
.cols{flex:1;overflow-x:auto;overflow-y:hidden;display:flex;padding:12px;gap:12px;}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:12px;color:var(--m);text-align:center;}
.col{width:300px;flex-shrink:0;background:var(--s);border:1px solid var(--b);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;height:100%;}
.ch{padding:10px 14px;border-bottom:1px solid var(--b);display:flex;align-items:center;gap:8px;flex-shrink:0;}
.ct{font-size:12px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ca{background:none;border:none;color:var(--m);cursor:pointer;font-size:14px;padding:0 2px;}
.ca:hover{color:var(--t);}
.cb{flex:1;overflow-y:auto;}
.cmsg{padding:30px;text-align:center;color:var(--m);font-size:12px;}
.spin{width:20px;height:20px;border:2px solid var(--b);border-top-color:var(--a);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px;}
@keyframes spin{to{transform:rotate(360deg)}}
.card{padding:11px 13px;border-bottom:1px solid var(--b);}
.card:hover{background:var(--s2);}
.card.new{border-left:2px solid var(--a);}
.cmeta{display:flex;align-items:center;gap:5px;margin-bottom:5px;flex-wrap:wrap;}
.csub{border-radius:4px;font-size:10px;font-weight:600;padding:2px 6px;}
.csub.reddit{background:rgba(255,69,0,.15);color:var(--reddit);}
.csub.bsky{background:rgba(0,133,255,.15);color:var(--bsky);}
.cauthor{font-size:11px;color:var(--m);}
.ctime{font-size:10px;color:var(--m);margin-left:auto;font-family:'JetBrains Mono',monospace;}
.ctitle{font-size:12px;font-weight:600;line-height:1.4;margin-bottom:5px;}
.ctitle .hl{color:var(--y);}
.cbody{font-size:11px;color:var(--m);line-height:1.5;margin-bottom:7px;max-height:55px;overflow:hidden;}
.cstats{display:flex;gap:10px;margin-bottom:7px;}
.cstat{font-size:10px;color:var(--m);}
.cstat span{color:var(--t);font-weight:600;}
.cactions{display:flex;gap:5px;}
.cab{background:var(--s2);border:1px solid var(--b);border-radius:5px;color:var(--m);cursor:pointer;font-size:11px;font-weight:500;padding:3px 8px;text-decoration:none;display:inline-block;transition:all .12s;}
.cab:hover{border-color:var(--a);color:var(--a);}
.cab.go{border-color:var(--reddit);color:var(--reddit);background:rgba(255,69,0,.08);}
.cab.go.bsky{border-color:var(--bsky);color:var(--bsky);background:rgba(0,133,255,.08);}
.cab.logged{opacity:.5;pointer-events:none;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-thumb{background:var(--b);border-radius:2px;}
</style>
</head>
<body>
<div class="header">
  <div class="logo">lead<span>/finder</span></div>
  <div class="dot"></div>
  <span id="srvStatus" style="font-size:11px;color:var(--g)">Connected</span>
  <input class="inp" id="qs" placeholder="Add keyword column..." style="width:220px">
  <button class="btnp" id="badd">+ Column</button>
  <div class="hright">
    <button class="btn" id="bref">↻ Refresh All</button>
    <button class="btn" id="ball">Open All</button>
  </div>
</div>

<div class="ptabs">
  <span style="font-size:11px;color:var(--m);margin-right:4px">Platform:</span>
  <button class="ptab reddit active" data-platform="reddit">🔴 Reddit</button>
  <button class="ptab bsky" data-platform="bluesky">🦋 Bluesky</button>
  <span style="font-size:11px;color:var(--m);margin-left:12px">For Twitter use OldTweetDeck →</span>
</div>

<div class="abar">
  <span style="font-size:11px;color:var(--m)">Agent:</span>
  <div id="acs"></div>
  <button class="btn" id="baga" style="font-size:11px;padding:3px 8px">+ Add</button>
</div>

<div class="body">
  <div class="sidebar">
    <div class="sh">Keywords</div>
    <div class="ss" id="kwl"></div>
    <div class="sf"><input id="kwi" placeholder="Add keyword..."><button id="bkwa">+</button></div>
  </div>
  <div class="cols" id="cols">
    <div class="empty">
      <div style="font-size:48px">🔍</div>
      <div style="font-size:16px;font-weight:600;color:var(--t)">No columns open</div>
      <div>Click keywords on the left or type above</div>
    </div>
  </div>
</div>

<script>
const KWS=[
  {cat:'🎨 Commissions',kws:['looking to commission','want to commission','commission open','need artist','looking for artist','find artist','who does commissions','hiring artist']},
  {cat:'🐺 Furry',kws:['fursuit commission','fursuit maker','furry commission','fursona art','looking for fursuit','anthro commission']},
  {cat:'🎲 DnD / Fantasy',kws:['dnd character commission','character art commission','oc commission','fantasy art commission','ttrpg art']},
  {cat:'🎭 VTuber',kws:['vtuber model commission','live2d commission','vtuber rigger','vtuber emote commission']},
  {cat:'🌐 3D / VRChat',kws:['vrchat avatar commission','3d model commission','blender commission','3d character commission']},
  {cat:'🎬 Animation',kws:['animation commission','looking for animator','animated emotes commission']},
  {cat:'🖼 Illustration',kws:['illustration commission','ref sheet commission','emote commission','pfp commission','chibi commission']},
  {cat:'💬 Buyer Signals',kws:['willing to pay for art','paying for commission','artist recommendations','how much for commission']},
];

const COLORS=['#6c63ff','#00d4aa','#ff6584','#ffd166','#4ecdc4','#ff9f43'];
let platform='reddit';
let customKws=JSON.parse(localStorage.getItem('lfCkws')||'[]');
let agents=JSON.parse(localStorage.getItem('lfAgents')||'[]');
let activeAgent=localStorage.getItem('lfAgent')||null;
let openCols=[];
let loggedIds=new Set(JSON.parse(localStorage.getItem('lfLogged')||'[]'));

function save(){
  localStorage.setItem('lfCkws',JSON.stringify(customKws));
  localStorage.setItem('lfAgents',JSON.stringify(agents));
  localStorage.setItem('lfLogged',JSON.stringify([...loggedIds].slice(-1000)));
  if(activeAgent)localStorage.setItem('lfAgent',activeAgent);
}

async function search(query){
  var endpoint=platform==='reddit'?'/api/reddit':'/api/bluesky';
  var params='?q='+encodeURIComponent(query)+'&limit=25';
  var res=await fetch(endpoint+params);
  if(!res.ok) throw new Error('Server error: '+res.status);
  return res.json();
}
function openCol(query){
  var key=query+'|'+platform;
  if(openCols.find(function(c){return c.key===key;}))return;
  var col={id:Date.now()+'_'+query,key:key,query:query,platform:platform,posts:[],loading:true,error:null,seenIds:new Set(),newCount:0};
  openCols.push(col);
  var wrap=document.getElementById('cols');
  var emp=wrap.querySelector('.empty');
  if(emp)emp.remove();
  var el=document.createElement('div');
  el.className='col';el.dataset.cid=col.id;
  var icon=platform==='reddit'?'🔴':'🦋';
  el.innerHTML='<div class="ch"><span style="font-size:14px">'+icon+'</span><div class="ct">'+esc(query)+'</div><button class="ca" data-reload="'+col.id+'">↻</button><button class="ca" data-close="'+col.id+'">×</button></div><div class="cb" id="cb_'+col.id+'"></div>';
  wrap.appendChild(el);
  loadCol(col);
  col.timer=setInterval(function(){loadCol(col);},90000);
  renderKws();
}

function closeCol(id){
  var col=openCols.find(function(c){return c.id===id;});
  if(col&&col.timer)clearInterval(col.timer);
  openCols=openCols.filter(function(c){return c.id!==id;});
  var el=document.querySelector('[data-cid="'+id+'"]');
  if(el)el.remove();
  if(!openCols.length)document.getElementById('cols').innerHTML='<div class="empty"><div style="font-size:48px">🔍</div><div style="font-size:16px;font-weight:600;color:var(--t)">No columns open</div><div>Click keywords on the left or type above</div></div>';
  renderKws();
}

async function loadCol(col){
  col.loading=true;col.error=null;
  var btn=document.querySelector('[data-reload="'+col.id+'"]');
  if(btn)btn.style.animation='spin .8s linear infinite';
  updateBody(col);
  try{
    var data=await search(col.query);
    var posts=Array.isArray(data)?data:[];
    var nc=0;
    posts.forEach(function(p){
      if(!col.seenIds.has(p.id)){
        p.isNew=col.posts.length>0;
        col.seenIds.add(p.id);
        if(p.isNew)nc++;
      }
    });
    col.posts=posts;col.newCount=nc;col.loading=false;col.error=null;
  }catch(e){col.loading=false;col.error=e.message;}
  if(btn)btn.style.animation='';
  updateBody(col);renderKws();
}

function updateBody(col){
  var body=document.getElementById('cb_'+col.id);
  if(!body)return;
  if(col.loading&&!col.posts.length){body.innerHTML='<div class="cmsg"><div class="spin"></div>Searching...</div>';return;}
  if(col.error){body.innerHTML='<div class="cmsg" style="color:var(--r)">⚠ '+esc(col.error)+'<br><button class="btn" style="margin-top:8px" data-retry="'+col.id+'">Retry</button></div>';return;}
  if(!col.posts.length){body.innerHTML='<div class="cmsg">No results found</div>';return;}
  body.innerHTML=col.posts.map(function(p){return card(p,col.query,col.platform);}).join('');
}

function card(p,query,plat){
  var logged=loggedIds.has(p.id);
  var isReddit=plat==='reddit';
  var title=hl(esc(p.title||p.text||''),query);
  var body=isReddit?(p.body?'<div class="cbody">'+esc(p.body)+'</div>':''):(p.text&&p.text!==p.title?'<div class="cbody">'+esc(p.text)+'</div>':'');
  var stats=isReddit?'<div class="cstats"><div class="cstat">▲ <span>'+(p.score||0)+'</span></div><div class="cstat">💬 <span>'+(p.comments||0)+'</span></div></div>':'<div class="cstats"><div class="cstat">♥ <span>'+(p.likes||0)+'</span></div><div class="cstat">🔁 <span>'+(p.reposts||0)+'</span></div></div>';
  var subLabel=isReddit?'<span class="csub reddit">r/'+esc(p.sub||'')+'</span>':'<span class="csub bsky">🦋 bsky</span>';
  var time=relTime(p.time);
  var author=isReddit?'u/'+esc(p.author||''):'@'+esc(p.handle||p.author||'');
  return '<div class="card'+(p.isNew?' new':'')+'">'+
    '<div class="cmeta">'+subLabel+'<span class="cauthor">'+author+'</span><span class="ctime">'+time+'</span></div>'+
    '<div class="ctitle">'+title+'</div>'+
    body+stats+
    '<div class="cactions">'+
    '<a class="cab" href="'+p.url+'" target="_blank">Open</a>'+
    '<a class="cab go '+(plat==='bluesky'?'bsky':'')+'" href="'+p.url+'" target="_blank">Reply</a>'+
    '<button class="cab '+(logged?'logged':'')+'" data-log="'+p.id+'" data-author="'+esc(p.author||p.handle||'')+'" data-url="'+esc(p.url)+'" data-plat="'+plat+'">'+(logged?'✓ Logged':'+ Log')+'</button>'+
    '</div></div>';
}

function renderKws(){
  var all=KWS.concat(customKws.length?[{cat:'🔎 Custom',kws:customKws}]:[]);
  document.getElementById('kwl').innerHTML=all.map(function(g){
    return '<div class="cl">'+g.cat+'</div>'+
      g.kws.map(function(kw){
        var col=openCols.find(function(c){return c.query===kw&&c.platform===platform;});
        var n=col&&col.posts?col.posts.length:0;
        return '<div class="ki '+(col?'active':'')+'" data-kw="'+esc(kw)+'"><div class="kc">'+(col?'✓':'')+'</div><div class="kt">'+esc(kw)+'</div>'+(n?'<div class="kn">'+n+'</div>':'')+'</div>';
      }).join('');
  }).join('');
}

function renderAgents(){
  var c=document.getElementById('acs');
  if(!agents.length){c.innerHTML='<span style="font-size:11px;color:var(--m);font-style:italic">Add your name →</span>';return;}
  c.innerHTML=agents.map(function(a,i){
    var color=COLORS[i%COLORS.length];
    var active=activeAgent===a.id;
    return '<button class="ach '+(active?'active':'')+'" data-agent="'+a.id+'" style="'+(active?'border-color:'+color+';background:'+color+'22;color:'+color:'')+'">'+esc(a.name)+'</button>';
  }).join('');
}

function logReach(id,author,url,plat,btn){
  if(loggedIds.has(id))return;
  loggedIds.add(id);save();
  btn.textContent='✓ Logged';btn.classList.add('logged');
  try{
    var t=JSON.parse(localStorage.getItem('outreachTracker')||'{"agents":[],"logs":[]}');
    if(activeAgent){
      t.logs.push({id:Date.now().toString(),agentId:activeAgent,platform:plat,action:'reply',postUrl:url,clientName:(plat==='reddit'?'u/':'@')+author,gotResponse:'no',notes:'From Lead Finder',date:new Date().toISOString().split('T')[0],ts:Date.now()});
      localStorage.setItem('outreachTracker',JSON.stringify(t));
    }
  }catch(e){}
  fetch(window.location.origin+'/api/log',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'log',agentId:activeAgent,agentName:agents.find(function(a){return a.id===activeAgent;})?agents.find(function(a){return a.id===activeAgent;}).name:'',platform:plat,clientHandle:author,postUrl:url,response:'no'})});
}

document.addEventListener('click',function(e){
  var t=e.target;
  var kwEl=t.closest('.ki');
  if(kwEl){
    var kw=kwEl.dataset.kw;
    var ex=openCols.find(function(c){return c.query===kw&&c.platform===platform;});
    if(ex)closeCol(ex.id);else openCol(kw);
    renderKws();return;
  }
  if(t.dataset.close){closeCol(t.dataset.close);return;}
  if(t.dataset.reload){var col=openCols.find(function(c){return c.id===t.dataset.reload;});if(col)loadCol(col);return;}
  if(t.dataset.retry){var col2=openCols.find(function(c){return c.id===t.dataset.retry;});if(col2)loadCol(col2);return;}
  if(t.dataset.log!==undefined){
    if(!activeAgent){document.getElementById('acs').style.outline='2px solid var(--r)';setTimeout(function(){document.getElementById('acs').style.outline='';},1500);return;}
    logReach(t.dataset.log,t.dataset.author,t.dataset.url,t.dataset.plat,t);return;
  }
  if(t.dataset.agent){activeAgent=t.dataset.agent;save();renderAgents();return;}
  if(t.dataset.platform){
    platform=t.dataset.platform;
    document.querySelectorAll('.ptab').forEach(function(b){b.classList.remove('active');});
    t.classList.add('active');
    renderKws();return;
  }
});

document.getElementById('badd').addEventListener('click',function(){
  var kw=document.getElementById('qs').value.trim();
  if(!kw)return;document.getElementById('qs').value='';
  if(!customKws.includes(kw)){customKws.push(kw);save();}
  openCol(kw);renderKws();
});
document.getElementById('qs').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('badd').click();});
document.getElementById('bref').addEventListener('click',function(){openCols.forEach(function(c,i){setTimeout(function(){loadCol(c);},i*1500);});});
document.getElementById('ball').addEventListener('click',function(){KWS.slice(0,8).forEach(function(g,i){setTimeout(function(){openCol(g.kws[0]);renderKws();},i*800);});});
document.getElementById('bkwa').addEventListener('click',function(){
  var kw=document.getElementById('kwi').value.trim();
  if(!kw)return;document.getElementById('kwi').value='';
  if(!customKws.includes(kw)){customKws.push(kw);save();renderKws();}
  openCol(kw);
});
document.getElementById('kwi').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('bkwa').click();});
document.getElementById('baga').addEventListener('click',function(){
  var name=prompt('Your name:');if(!name||!name.trim())return;
  var a={id:'a_'+Date.now(),name:name.trim()};
  agents.push(a);if(!activeAgent)activeAgent=a.id;save();renderAgents();
  try{
    var t=JSON.parse(localStorage.getItem('outreachTracker')||'{"agents":[],"logs":[]}');
    if(!t.agents.find(function(x){return x.id===a.id;})){
      t.agents.push({id:a.id,name:a.name,color:COLORS[agents.length%COLORS.length],shift:'Day'});
      localStorage.setItem('outreachTracker',JSON.stringify(t));
    }
  }catch(e){}
});

function relTime(iso){var d=Math.floor((Date.now()-new Date(iso))/1000);if(d<60)return d+'s';if(d<3600)return Math.floor(d/60)+'m';if(d<86400)return Math.floor(d/3600)+'h';return Math.floor(d/86400)+'d';}
function hl(text,q){var words=q.split(' ').filter(function(w){return w.length>2;});var o=text;words.forEach(function(w){o=o.replace(new RegExp('('+w+')','gi'),'<span class="hl">$1</span>');});return o;}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

renderKws();renderAgents();
</script>
</body>
</html>
